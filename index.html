<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Shop</title>
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            color: var(--tg-theme-text-color);
            background: var(--tg-theme-bg-color);
        }

        #main{
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-top: 50px;
            margin-bottom: 10px;
        }

        img {
            width: 70px;
            margin: 30px auto;
        }

        p {
            width: 350px;
            margin: 0 auto;
        }
        button {
            border: 0;
            border-radius: 5px;
            margin-top: 50px;
            height: 60px;
            width: 200px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 500ms ease;
            color: var(--tg-theme-button-text-color);
            background: var(--tg-theme-button-color);
        }

        button:hover {
            opacity: 0.8;
        }

        #form {
            display: none;
            text-align: center;
        }

        input {
            width: 90%;
            outline: none;
            margin: 10px 5%;
            padding: 15px 10px;
            font-size: 14px;
            border: 2px solid silver;
            border-radius: 5px;
        }

        input:focus {
            border-color: #db5d5d;
        }

        /* Стиль для текста ошибок */
        #error {
            color: red;
            font-weight: 500;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Онлайн магазин</h1>
        <img src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png">
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Accusantium ipsum magni, molestias</p>
        <button id="buy">Купить</button>
    </div>
    
    <!-- Добавили onsubmit="return false;", чтобы форма не перезагружала страницу -->
    <form id="form" onsubmit="return false;">
        <h1>Оформление покупки</h1>
        <input type="text" placeholder="Имя" id="user_name">
        <input type="text" placeholder="Email" id="user_email">
        <input type="text" placeholder="Телефон" id="user_phone">
        
        <!-- Сюда теперь будет выводиться innerText ошибки -->
        <div id="error"></div> 
        
        <button id="order">Оформить</button>
    </form>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script>
        let tg = window.Telegram.WebApp;
        let buy = document.getElementById("buy");
        let order = document.getElementById("order");
        tg.expand();

        buy.addEventListener('click', () =>{
            document.getElementById("main").style.display = "none";
            document.getElementById("form").style.display = "block";
            
            // Безопасное получение имени и фамилии (не сломается в обычном браузере)
            let user = tg.initDataUnsafe?.user;
            if (user) {
                let firstName = user.first_name || "";
                let lastName = user.last_name || "";
                document.getElementById("user_name").value = (firstName + " " + lastName).trim();
            }
        });

        // Добавили event (e) для отмены стандартного поведения кнопки
        order.addEventListener("click", (e) => {
            e.preventDefault(); // Предотвращает перезагрузку страницы
            
            document.getElementById("error").innerText = '';
            let name = document.getElementById("user_name").value;
            let email = document.getElementById("user_email").value;
            let phone = document.getElementById("user_phone").value;
            
            if (name.length < 5){
                document.getElementById("error").innerText = 'Ошибка в имени';
                return;
            }
            if (email.length < 5){
                document.getElementById("error").innerText = 'Ошибка в email';
                return;
            }
            if (phone.length < 5){
                document.getElementById("error").innerText = 'Ошибка в номере телефона';
                return;
            }

            let data = {
                name: name,
                email: email,
                phone: phone
            }
            
            // Внимание: sendData работает ТОЛЬКО если Web App открыто через KeyboardButton / ReplyButton.
            // Если оно открыто через Inline-кнопку, нужно использовать tg.CloudStorage или отправку через API.
            tg.sendData(JSON.stringify(data));
            
            // Закрываем окно
            tg.close();
        });
    </script>
</body>
</html>
